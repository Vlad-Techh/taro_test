<script>
    // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        tg.ready();
        console.log("Telegram WebApp initDataUnsafe:", tg.initDataUnsafe);
    } else {
        console.log("Telegram WebApp не доступен (открыто не через мини-апп)");
    }

    // ВАЖНО: твой URL вебхука
    // Для постоянной работы: /webhook/... а не /webhook-test/...
    const WEBHOOK_URL = "https://vladtech-n8n.ru/webhook-test/numerology";
    // const WEBHOOK_URL = "https://vladtech-n8n.ru/webhook/numerology"; // боевой вариант

    const numerologyBlock = document.getElementById("numerology-fields");
    const tarotBlock = document.getElementById("tarot-fields");
    const submitBtn = document.getElementById("submit-btn");
    const errorBox = document.getElementById("error-box");

    function showError(msg) {
        if (tg && tg.showAlert) {
            tg.showAlert(msg);
        } else {
            alert(msg);
        }
        errorBox.textContent = msg;
        errorBox.style.display = "block";
    }

    function clearError() {
        errorBox.textContent = "";
        errorBox.style.display = "none";
    }

    function setLoading(state) {
        if (state) {
            submitBtn.classList.add("loading");
            submitBtn.disabled = true;
        } else {
            submitBtn.classList.remove("loading");
            submitBtn.disabled = false;
        }
    }

    function toggleFields() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === "numerology") {
            numerologyBlock.style.display = "flex";
            tarotBlock.style.display = "none";
        } else {
            numerologyBlock.style.display = "none";
            tarotBlock.style.display = "flex";
        }
        clearError();
    }

    function getTelegramUserId() {
        // Пытаемся достать user.id из WebApp-контекста
        const userId = tg?.initDataUnsafe?.user?.id;

        if (!userId) {
            console.error("Не удалось получить Telegram user.id из initDataUnsafe:", tg?.initDataUnsafe);
            showError("Не удалось получить ваш Telegram ID. Откройте мини-приложение через бота, а не как обычную ссылку.");
            return null;
        }

        return userId;
    }

    function sendData() {
        clearError();
        const mode = document.querySelector('input[name="mode"]:checked').value;

        const userId = getTelegramUserId();
        if (!userId) {
            // Если ID нет — не отправляем запрос
            return;
        }

        const data = {
            tg_id: userId,   // ВСЕГДА реальный Telegram ID
            mode: mode
        };

        if (mode === "numerology") {
            const name = document.getElementById("name").value.trim();
            const birthDate = document.getElementById("birthdate").value;

            if (!birthDate) {
                return showError("Введите дату рождения.");
            }

            data.name = name || null;
            data.birth_date = birthDate;
        } else {
            const question = document.getElementById("question").value.trim();
            if (!question) {
                return showError("Напишите ваш вопрос.");
            }
            data.question = question;
        }

        setLoading(true);

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
            .then(async (res) => {
                if (!res.ok) {
                    const txt = await res.text().catch(() => "");
                    console.error("Webhook error:", res.status, txt);
                    showError("Ошибка при отправке запроса. Попробуйте ещё раз.");
                    setLoading(false);
                    return;
                }

                // Успешно — закрываем мини-апп
                if (tg && tg.close) {
                    tg.close();
                } else {
                    setLoading(false);
                    showError("Ответ отправлен. Можно закрыть окно.");
                }
            })
            .catch((err) => {
                console.error("Fetch error:", err);
                showError("Не удалось связаться с сервером.");
                setLoading(false);
            });
    }

    // Слушатели
    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('input[name="mode"]').forEach((el) => {
            el.addEventListener("change", toggleFields);
        });
        submitBtn.addEventListener("click", sendData);
    });
</script>
