<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Мистический Бот</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bg: #0f1014;
            --card: #181a22;
            --accent: #8b5cff;
            --accent-soft: rgba(139, 92, 255, 0.15);
            --accent-hover: #a68bff;
            --text: #f7f7ff;
            --text-muted: #b3b3c7;
            --error: #ff5c7a;
            --radius-lg: 18px;
            --radius-full: 999px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #22263a, #05060a 55%);
            color: var(--text);
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 20px 16px 32px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .card {
            background: linear-gradient(145deg, #151726, #11131d);
            border-radius: 24px;
            padding: 20px 18px 22px;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        h2 {
            margin: 0 0 4px;
            font-size: 22px;
            letter-spacing: 0.03em;
        }

        .subtitle {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Переключатель режимов */
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            background: #111320;
            padding: 4px;
            border-radius: var(--radius-full);
        }

        .mode-option { flex: 1; }
        .mode-option input { display: none; }

        .mode-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 10px;
            border-radius: var(--radius-full);
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease-out;
        }

        .mode-label span.icon { font-size: 16px; }

        .mode-option input:checked + .mode-label {
            background: var(--accent-soft);
            color: var(--text);
            box-shadow: 0 0 0 1px rgba(139, 92, 255, 0.6);
        }

        /* Формы */
        .fields {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input,
        textarea {
            width: 100%;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(5, 6, 12, 0.8);
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
        }

        .input::placeholder,
        textarea::placeholder {
            color: rgba(179, 179, 199, 0.7);
        }

        .input:focus,
        textarea:focus {
            border-color: rgba(139, 92, 255, 0.9);
            box-shadow: 0 0 0 1px rgba(139, 92, 255, 0.7);
            background: rgba(7, 9, 18, 0.98);
        }

        textarea {
            min-height: 110px;
            resize: none;
            border-radius: 16px;
        }

        /* Кнопка */
        .actions { margin-top: 16px; }

        #submit-btn {
            width: 100%;
            border: none;
            border-radius: var(--radius-full);
            padding: 13px 18px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5cff, #ff7ad9);
            color: #fff;
            box-shadow: 0 14px 30px rgba(139, 92, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out, filter 0.1s ease-out;
        }

        #submit-btn span.loader {
            display: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }

        #submit-btn.loading {
            filter: brightness(1.02);
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 10px 22px rgba(139, 92, 255, 0.3);
            cursor: default;
        }

        #submit-btn.loading span.text { opacity: 0.8; }
        #submit-btn.loading span.loader { display: inline-block; }

        #submit-btn:active:not(.loading) {
            transform: translateY(2px) scale(0.985);
            box-shadow: 0 8px 18px rgba(139, 92, 255, 0.3);
        }

        .error-text {
            margin-top: 6px;
            font-size: 12px;
            color: var(--error);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Карточка результата */
        .result-card {
            margin-top: 18px;
            padding: 14px 12px 14px;
            border-radius: 18px;
            background: radial-gradient(circle at top left, rgba(139, 92, 255, 0.16), rgba(8, 10, 20, 0.95));
            border: 1px solid rgba(139, 92, 255, 0.35);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.2s ease-out, transform 0.2s ease-out;
        }

        .result-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .result-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px;
            align-items: center;
        }

        .result-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-numbers {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .result-text {
            font-size: 14px;
            line-height: 1.4;
            white-space: pre-line;
        }

        /* Блок карты Таро */
        .tarot-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tarot-card img {
            max-width: 160px;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
        }
        
        #tarot-image.reversed {
           transform: rotate(180deg);
           transition: transform 0.25s ease-out;
        }

        .tarot-card-name {
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="card">
        <h2>Мистический Бот</h2>
        <p class="subtitle">Персональные нумерологические расчёты и ответы карт Таро</p>

        <div class="mode-switch">
            <label class="mode-option">
                <input type="radio" name="mode" value="numerology" checked />
                <div class="mode-label">
                    <span class="icon">✨</span>
                    <span>Нумерология</span>
                </div>
            </label>

            <label class="mode-option">
                <input type="radio" name="mode" value="tarot" />
                <div class="mode-label">
                    <span class="icon">🃏</span>
                    <span>Таро</span>
                </div>
            </label>
        </div>

        <!-- Нумерология -->
        <div id="numerology-fields" class="fields">
            <div>
                <div class="field-label">Имя</div>
                <input type="text" id="name" class="input" placeholder="Например, Влад" />
            </div>

            <div>
                <div class="field-label">Дата рождения</div>
                <input type="date" id="birthdate" class="input" />
            </div>
        </div>

        <!-- Таро -->
        <div id="tarot-fields" class="fields" style="display: none;">
            <div>
                <div class="field-label">Ваш вопрос</div>
                <textarea id="question" placeholder="Напишите ваш вопрос к картам..."></textarea>
            </div>
        </div>

        <div id="error-box" class="error-text" style="display:none;"></div>

        <div class="actions">
            <button id="submit-btn" type="button">
                <span class="loader"></span>
                <span class="text">Получить ответ</span>
            </button>
        </div>

        <!-- Карточка с результатом -->
        <div id="result-card" class="result-card" style="display:none;">
            <div class="result-title" id="result-title" style="text-align: center;"></div>
            <div class="result-subtitle" id="result-subtitle"></div>

            <!-- Числа нумерологии -->
            <div class="result-numbers" id="result-numbers" style="display:none;"></div>

            <!-- Карта Таро -->
            <div class="tarot-card" id="tarot-card" style="display:none;">
                <img id="tarot-image" alt="Карта Таро" />
                <div class="tarot-card-name" id="tarot-card-name"></div>
            </div>

            <div class="result-text" id="result-text"></div>
        </div>
    </div>
</div>

<script>
    // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEBAPP
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        tg.ready();
    }

    // один и тот же вебхук, дальше n8n сам решает: нумерология/таро
    const WEBHOOK_URL = "https://vladtech-n8n.ru/webhook/numerology";

    const numerologyBlock = document.getElementById("numerology-fields");
    const tarotBlock = document.getElementById("tarot-fields");
    const submitBtn = document.getElementById("submit-btn");
    const errorBox = document.getElementById("error-box");

    const resultCard = document.getElementById("result-card");
    const resultTitle = document.getElementById("result-title");
    const resultSubtitle = document.getElementById("result-subtitle");
    const resultNumbers = document.getElementById("result-numbers");
    const resultText = document.getElementById("result-text");

    const tarotCard = document.getElementById("tarot-card");
    const tarotImage = document.getElementById("tarot-image");
    const tarotCardName = document.getElementById("tarot-card-name");

    function showError(msg) {
        if (tg && tg.showAlert) tg.showAlert(msg); else alert(msg);
        errorBox.textContent = msg;
        errorBox.style.display = "block";
    }

    function clearError() {
        errorBox.textContent = "";
        errorBox.style.display = "none";
    }

    function clearResult() {
        resultCard.classList.remove("visible");
        resultCard.style.display = "none";
        resultTitle.textContent = "";
        resultSubtitle.textContent = "";
        resultText.textContent = "";

        resultNumbers.textContent = "";
        resultNumbers.style.display = "none";

        tarotCard.style.display = "none";
        tarotImage.src = "";
        tarotCardName.textContent = "";
    }

    function showResult(payload) {
    console.log("Payload from backend:", payload);

    const mode = payload.mode || null;

    // --- РЕЖИМ ТАРО ---
    if (mode === "tarot") {
        // 1) Базовое имя карты (из бэка)
        const baseName = payload.card_name || payload.title || "Карта Таро";

        // card_reversed может прийти как boolean или строка "true"/"false"
        const isReversed = (
            payload.card_reversed === true ||
            payload.card_reversed === "true"
        );

        // 2) Полное имя: добавляем "(перевёрнутая)" если нужно
        const fullName = isReversed
            ? `${baseName} (перевёрнутая)`
            : baseName;

        // Заголовок по центру над картой
        resultTitle.textContent = fullName;
        resultTitle.style.textAlign = "center";

        // Сабтайтл ТАРО не нужен
        resultSubtitle.textContent = "";
        resultSubtitle.style.display = "none";

        // Нумерологические числа в режиме ТАРО не показываем
        resultNumbers.textContent = "";
        resultNumbers.style.display = "none";

        // 3) Картинка и подпись под картой
        if (payload.card_image_url) {
            tarotImage.src = payload.card_image_url;

            // подпись под картой — ТО ЖЕ САМОЕ, что и заголовок
            tarotCardName.textContent = fullName;

            // переворот картинки, если карта перевёрнутая
            if (isReversed) {
                tarotImage.classList.add("reversed");
            } else {
                tarotImage.classList.remove("reversed");
            }

            tarotCard.style.display = "flex";
        } else {
            tarotCard.style.display = "none";
            tarotImage.src = "";
            tarotCardName.textContent = "";
            tarotImage.classList.remove("reversed");
        }

        // 4) Текст трактовки
        resultText.textContent = payload.text || "Ответ получен, но сервер не прислал текст.";
    }

    // --- РЕЖИМ НУМЕРОЛОГИИ ---
    else {
        resultTitle.textContent = payload.title || "Ваш результат готов ✨";

        if (payload.subtitle) {
            resultSubtitle.textContent = payload.subtitle;
            resultSubtitle.style.display = "block";
        } else {
            resultSubtitle.textContent = "";
            resultSubtitle.style.display = "none";
        }

        const parts = [];
        if (payload.life_path_number != null) {
            parts.push(`Число жизненного пути: ${payload.life_path_number}`);
        }
        if (payload.birthday_number != null) {
            parts.push(`Число дня рождения: ${payload.birthday_number}`);
        }
        if (payload.personal_year != null) {
            parts.push(`Число персонального года: ${payload.personal_year}`);
        }
        if (parts.length) {
            resultNumbers.textContent = parts.join(" • ");
            resultNumbers.style.display = "block";
        } else {
            resultNumbers.textContent = "";
            resultNumbers.style.display = "none";
        }

        // Для нумерологии карту не показываем
        tarotCard.style.display = "none";
        tarotImage.src = "";
        tarotCardName.textContent = "";
        tarotImage.classList.remove("reversed");

        resultText.textContent = payload.text || "Ответ получен, но сервер не прислал текст.";
    }

    // Показать карточку результата
    resultCard.style.display = "block";
    requestAnimationFrame(() => resultCard.classList.add("visible"));
}

    function setLoading(state) {
        if (state) {
            submitBtn.classList.add("loading");
            submitBtn.disabled = true;
        } else {
            submitBtn.classList.remove("loading");
            submitBtn.disabled = false;
        }
    }

    function toggleFields() {
        const mode = document.querySelector('input[name="mode"]:checked').value;
        if (mode === "numerology") {
            numerologyBlock.style.display = "flex";
            tarotBlock.style.display = "none";
        } else {
            numerologyBlock.style.display = "none";
            tarotBlock.style.display = "flex";
        }
        clearError();
        clearResult();
    }

    function getTelegramUserId() {
        const userId = tg?.initDataUnsafe?.user?.id;
        if (!userId) {
            showError("Не удалось получить ваш Telegram ID. Откройте мини-приложение через бота.");
            return null;
        }
        return userId;
    }

    function sendData() {
        clearError();
        clearResult();

        const mode = document.querySelector('input[name="mode"]:checked').value;
        const userId = getTelegramUserId();
        if (!userId) return;

        const data = { tg_id: userId, mode };

        if (mode === "numerology") {
            const name = document.getElementById("name").value.trim();
            const birthDate = document.getElementById("birthdate").value;
            if (!birthDate) return showError("Введите дату рождения.");
            data.name = name || null;
            data.birth_date = birthDate;
        } else {
            const question = document.getElementById("question").value.trim();
            if (!question) return showError("Напишите ваш вопрос.");
            data.question = question;
        }

        setLoading(true);

        fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
            .then(async (res) => {
                let json = null;
                try {
                    json = await res.json();
                } catch (e) {
                    console.error("JSON parse error:", e);
                }

                if (!res.ok) {
                    console.error("Webhook error:", res.status, json || (await res.text().catch(() => "")));
                    showError("Ошибка при отправке запроса. Попробуйте ещё раз.");
                    setLoading(false);
                    return;
                }

                if (!json || json.status !== "ok") {
                    console.warn("Необычный формат ответа:", json);
                    showResult({
                        title: "Ответ получен",
                        text: typeof json === "string" ? json : JSON.stringify(json, null, 2)
                    });
                } else {
                    showResult(json);
                }

                setLoading(false);
            })
            .catch((err) => {
                console.error("Fetch error:", err);
                showError("Не удалось связаться с сервером.");
                setLoading(false);
            });
    }

    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll('input[name="mode"]').forEach((el) => {
            el.addEventListener("change", toggleFields);
        });
        submitBtn.addEventListener("click", sendData);
    });
</script>
</body>
</html>
