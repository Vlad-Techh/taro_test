<body>
    <h2>Мистический Бот</h2>

    <div style="margin-bottom: 20px;">
        <label>
            <input type="radio" name="mode" value="numerology" checked onchange="toggleFields()"> Нумерология
        </label>
        <label>
            <input type="radio" name="mode" value="tarot" onchange="toggleFields()"> Таро (Вопрос)
        </label>
    </div>

    <div id="numerology-fields">
        <input type="text" id="name" placeholder="Ваше имя">
        <input type="date" id="birthdate">
    </div>

    <div id="tarot-fields" style="display:none;">
        <textarea id="question" rows="4" placeholder="Напишите ваш вопрос..." style="width:100%; border-radius:10px; padding:10px;"></textarea>
    </div>

    <button onclick="sendData()">Получить ответ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // ВСТАВЬ СЮДА СВОЙ ВЕБХУК
        const WEBHOOK_URL = "https://vladtech-n8n.ru/webhook-test/numerology"; 

        function toggleFields() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('numerology-fields').style.display = mode === 'numerology' ? 'block' : 'none';
            document.getElementById('tarot-fields').style.display = mode === 'tarot' ? 'block' : 'none';
        }

        function sendData() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            let data = {
                tg_id: tg.initDataUnsafe?.user?.id || "test_id",
                mode: mode
            };

            if (mode === 'numerology') {
                data.name = document.getElementById("name").value;
                data.birth_date = document.getElementById("birthdate").value;
                if (!data.birth_date) return tg.showAlert("Введите дату!");
            } else {
                data.question = document.getElementById("question").value;
                if (!data.question) return tg.showAlert("Напишите вопрос!");
            }

            const btn = document.querySelector('button');
            btn.innerText = "Магия происходит...";

            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(res => {
                tg.close();
            })
            .catch(err => {
                btn.innerText = "Ошибка";
            });
        }
    </script>
</body>
